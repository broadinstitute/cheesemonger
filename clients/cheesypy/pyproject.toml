[project]
name = "cheesypy"
version = "0.4.1"
description = "Python client for the Cheesemonger perturb-seq API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tutorial notebooks favour compact, illustrative style: long one-liners and
# grouped statements (e.g. `plt.xlabel(...); plt.ylabel(...)`). Silence those
# two style rules there while still catching real issues (undefined names, etc.).
"examples/**" = ["E501", "E702"]
